<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Design Tank Tool Catalogue</title><style>
:root{--ivory:#f6f1e7;--paper:#fffdf8;--teal:#164d4b;--mustard:#dfb75b;--rust:#b85f40;--ink:#293331;--line:#d8d1c3}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font:16px/1.55 'Avenir Next',Avenir,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--rust);outline-offset:3px}header{background:var(--teal);color:white;padding:2rem max(1.2rem,calc((100vw - 1180px)/2)) 2.4rem}header small{font-weight:800;letter-spacing:.2em;color:var(--mustard)}h1,h2,h3{font-family:Georgia,serif;line-height:1.18}h1{font-size:clamp(2.4rem,5vw,4.5rem);margin:.4rem 0}header p{max-width:650px;margin:0}main{max-width:1220px;margin:auto;padding:1.5rem 1.2rem 5rem}.toolbar{display:grid;grid-template-columns:2fr repeat(3,1fr) auto;gap:.75rem;align-items:end;padding:1rem;background:var(--paper);border:1px solid var(--line);border-radius:15px}label{display:block;font-size:.82rem;font-weight:800;letter-spacing:.04em}input,select{width:100%;padding:.7rem;border:1px solid #aaa99e;border-radius:8px;background:white;color:var(--ink)}.action{border:0;border-radius:8px;padding:.75rem 1rem;background:var(--mustard);color:#26251f;font-weight:800;white-space:nowrap}.meta{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin:1.3rem 0;color:#475552}.status{padding:1rem;background:#fff6d9;border-left:5px solid var(--mustard);margin:1rem 0;border-radius:5px}.status.error{background:#fbe8df;border-color:var(--rust)}[hidden]{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.1rem}.card{display:block;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 5px 20px #164d4b12;transition:transform .18s}.card:hover{transform:translateY(-4px)}.card img,.photo-placeholder{width:100%;height:190px;object-fit:cover;background:#e7e0d2;display:grid;place-items:center;color:var(--teal);font-weight:700}.card-body{padding:1rem}.eyebrow{color:var(--rust);font-size:.76rem;font-weight:900;text-transform:uppercase;letter-spacing:.09em}.card h2{font-size:1.4rem;margin:.35rem 0}.chip{display:inline-block;background:#e8eee8;border-radius:99px;padding:.18rem .55rem;font-size:.78rem;margin:.2rem .25rem .2rem 0}.detail{background:var(--paper);padding:clamp(1rem,3vw,2.5rem);border:1px solid var(--line);border-radius:16px}.back{border:0;background:none;color:var(--teal);font-weight:800;padding:.5rem 0;margin-bottom:1rem;text-decoration:underline}.detail h2{font-size:clamp(2rem,4vw,3.4rem);margin:.35rem 0}.hero-image{max-width:100%;width:100%;max-height:530px;object-fit:contain;background:#e7e0d2;border-radius:12px}.gallery{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0 1.5rem}.gallery button{border:2px solid transparent;padding:0;background:transparent;border-radius:7px}.gallery button[aria-pressed=true]{border-color:var(--rust)}.gallery img{width:76px;height:62px;object-fit:cover;border-radius:5px}.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.85fr);gap:2rem}.fact{margin:.4rem 0}.section{border-top:1px solid var(--line);padding:1.15rem 0}.section h3{color:var(--teal);margin:0 0 .65rem;font-size:1.35rem}.field{margin:.6rem 0;white-space:pre-line;overflow-wrap:anywhere}.field strong{display:block;font-size:.8rem;color:var(--rust);text-transform:uppercase;letter-spacing:.06em}.resource{display:block;overflow-wrap:anywhere;margin:.5rem 0;color:var(--teal)}.note{font-size:.88rem;color:#495350;margin-top:1.5rem}.empty{padding:3rem 1rem;text-align:center;background:var(--paper);border-radius:12px}@media(max-width:820px){.toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar label:first-child{grid-column:1/-1}.detail-layout{grid-template-columns:1fr}}@media(max-width:480px){.toolbar{grid-template-columns:1fr}.toolbar label:first-child{grid-column:auto}.gallery img{width:64px;height:54px}}@media(prefers-reduced-motion:reduce){.card{transition:none}}
.card img{object-fit:contain}
</style></head><body><header><small>THE MAKERSPACE GUIDE</small><h1>Design Tank<br>Tool Catalogue</h1><p>Find a tool, learn what it does, and check what you need to know before using it.</p></header><main><div id="listing"><div class="toolbar"><label>Search tools<input id="search" type="search" placeholder="Name or alias"></label><label>Zone<select id="zone"><option value="">All zones</option></select></label><label>Tool type<select id="type"><option value="">All types</option></select></label><label>Hazard<select id="hazard"><option value="">All hazards</option></select></label><button class="action" id="refresh" type="button">Refresh catalogue</button></div><div class="meta"><span id="count"></span><span id="updated"></span></div><div class="status" id="status" role="status" aria-live="polite">Loading catalogue…</div><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>No tools match these filters.</div></div><article class="detail" id="detail" hidden></article></main><script>
'use strict';
// Paste the published-to-web CSV URL from the PUBLIC tab here. Never use a private/edit URL.
const SHEET_CSV_URL = 'PASTE_PUBLISHED_CSV_URL_HERE';
const POLL_MS = 5 * 60 * 1000;
const fields = ['id','name','aliases','make_model','zone','tool_type','exact_location','main_photo_url','photo_2_url','photo_3_url','photo_4_url','photo_5_url','purpose','typical_uses','how_it_works','limits','suitable_materials','prohibited_materials','supplies_accessories_software','setup_settings','condition_checks','training_permission_supervision','hazards','specific_risks_precautions','protective_gear_clothing','workspace_ventilation','when_how_to_stop','start','use_check_results','finish_shutdown_cooling_cleanup_storage','common_problem','safe_response','when_whom_to_ask','manual_training_links','sources_checked_date','manual_pdf_url'];
const $=id=>document.getElementById(id); let tools=[],lastLoaded=null,loading=false;const controls=['search','zone','type','hazard'];
function csvParse(raw){const rows=[];let row=[],cell='',quoted=false;raw=raw.replace(/^\uFEFF/,'');for(let i=0;i<raw.length;i++){const c=raw[i];if(quoted){if(c==='"'&&raw[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"'&&cell==='')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&raw[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('The published CSV has an unfinished quoted field.');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
function parseTools(csv){const rows=csvParse(csv);if(!rows.length)throw Error('The published sheet is empty.');const headers=rows.shift().map(s=>s.trim().toLowerCase());for(const key of fields)if(!headers.includes(key))throw Error('Missing sheet column: '+key);const ids=new Set();return rows.map((row,n)=>{const obj={};headers.forEach((key,i)=>obj[key]=(row[i]||'').trim());if(!obj.id&&!obj.name)return null;if(!obj.id||!obj.name)throw Error('A tool is missing its ID or name (data row '+(n+2)+').');if(ids.has(obj.id))throw Error('Duplicate tool ID: '+obj.id);ids.add(obj.id);return obj}).filter(Boolean)}
function split(s){return (s||'').split(/[;,\n]+/).map(x=>x.trim()).filter(Boolean)}function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function safeUrl(raw){try{const u=new URL(raw);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}function setStatus(msg,error=false){$('status').hidden=!msg;$('status').textContent=msg||'';$('status').classList.toggle('error',error)}function placeholder(){return el('div','photo-placeholder','Photo unavailable')}function photo(url,alt,cls){const src=safeUrl(url);if(!src)return placeholder();const img=el('img',cls);img.alt=alt;img.loading='lazy';img.src=src;img.addEventListener('error',()=>img.replaceWith(placeholder()),{once:true});return img}
function populate(id,key){const sel=$(id),before=sel.value;while(sel.options.length>1)sel.remove(1);[...new Set(tools.flatMap(t=>key==='hazards'?split(t[key]):[t[key]]).filter(Boolean))].sort((a,b)=>a.localeCompare(b)).forEach(v=>sel.add(new Option(v,v)));sel.value=before}function filters(){let q=$('search').value.trim().toLocaleLowerCase();const found=tools.filter(t=>(!q||[t.name,t.aliases].some(v=>v.toLocaleLowerCase().includes(q)))&&(!$('zone').value||t.zone===$('zone').value)&&(!$('type').value||t.tool_type===$('type').value)&&(!$('hazard').value||split(t.hazards).includes($('hazard').value)));$('count').textContent=found.length+' of '+tools.length+' tools';$('grid').replaceChildren(...found.map(card));$('empty').hidden=!!found.length||!tools.length}
function card(t){const a=el('a','card');a.href='#tool/'+encodeURIComponent(t.id);a.append(photo(t.main_photo_url,t.name));const body=el('div','card-body');body.append(el('div','eyebrow',t.zone||'Tool'),el('h2','',t.name));if(t.tool_type)body.append(el('span','chip',t.tool_type));a.append(body);return a}
function field(parent,label,value){if(!value||/^(n\/a|none|not applicable)$/i.test(value.trim()))return;const p=el('p','field');p.append(el('strong','',label),document.createTextNode(value));parent.append(p)}function section(parent,title,entries){const wrap=el('section','section');wrap.append(el('h3','',title));entries.forEach(([label,value])=>field(wrap,label,value));if(wrap.children.length>1)parent.append(wrap)}
function renderDetail(t){const a=$('detail');a.replaceChildren();const back=el('button','back','← Back to catalogue');back.type='button';back.onclick=()=>{location.hash='';};a.append(back,el('div','eyebrow',t.zone||'Tool'),el('h2','',t.name));const facts=el('div');[['ID',t.id],['Type',t.tool_type],['Location',t.exact_location],['Make / model',t.make_model],['Also known as',t.aliases]].forEach(([k,v])=>field(facts,k,v));a.append(facts);const layout=el('div','detail-layout'),left=el('div'),right=el('div');const urls=[t.main_photo_url,t.photo_2_url,t.photo_3_url,t.photo_4_url,t.photo_5_url].map(safeUrl).filter(Boolean);if(urls.length){const stage=el('div');const big=photo(urls[0],t.name,'hero-image');stage.append(big);left.append(stage);if(urls.length>1){const strip=el('div','gallery');strip.setAttribute('aria-label','Tool photos');urls.forEach((url,i)=>{const b=el('button');b.type='button';b.setAttribute('aria-label','View photo '+(i+1));b.setAttribute('aria-pressed',String(i===0));b.append(photo(url,t.name+' photo '+(i+1)));b.onclick=()=>{stage.replaceChildren(photo(url,t.name+' photo '+(i+1),'hero-image'));strip.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))};strip.append(b)});left.append(strip)}}else left.append(placeholder());section(right,'Understand the tool',[['Purpose',t.purpose],['Typical uses',t.typical_uses],['How it works',t.how_it_works],['Limits',t.limits]]);section(right,'Before you begin',[['Suitable materials',t.suitable_materials],['Do not use with',t.prohibited_materials],['Supplies, accessories or software',t.supplies_accessories_software],['Setup and settings',t.setup_settings],['Condition checks',t.condition_checks],['Training, permission and supervision',t.training_permission_supervision]]);section(right,'Safety',[['Hazards',t.hazards],['Risks and precautions',t.specific_risks_precautions],['Protective gear and clothing',t.protective_gear_clothing],['Workspace and ventilation',t.workspace_ventilation],['When and how to stop',t.when_how_to_stop]]);section(right,'Use the tool',[['Start',t.start],['Use and check results',t.use_check_results],['Finish, shut down, cool, clean and store',t.finish_shutdown_cooling_cleanup_storage]]);section(right,'Troubleshooting',[['Common problem',t.common_problem],['Safe response',t.safe_response],['When and whom to ask',t.when_whom_to_ask]]);const resources=el('section','section');resources.append(el('h3','','Resources'));const manual=safeUrl(t.manual_pdf_url);if(manual){const pdf=el('a','resource','Open PDF manual ↗');pdf.href=manual;pdf.target='_blank';pdf.rel='noopener noreferrer';resources.append(pdf)}split(t.manual_training_links).forEach(link=>{const url=safeUrl(link);if(url){const anchor=el('a','resource',url);anchor.href=url;anchor.target='_blank';anchor.rel='noopener noreferrer';resources.append(anchor)}});field(resources,'Sources / checked date',t.sources_checked_date);if(resources.children.length>1)right.append(resources);layout.append(left,right);a.append(layout,el('p','note','This guide complements tool manuals, school rules, training and required supervision. If unsure, stop and ask a teacher.'))}
function route(){const match=location.hash.match(/^#tool\/(.+)$/);let id='';try{id=match?decodeURIComponent(match[1]):''}catch{}const t=tools.find(x=>x.id===id);$('listing').hidden=!!match&&!!t;$('detail').hidden=!t;if(t){renderDetail(t);document.title=t.name+' | Design Tank Tool Catalogue';window.scrollTo(0,0)}else{document.title='Design Tank Tool Catalogue';if(match&&tools.length)setStatus('Tool not found. Check the QR link or return to the catalogue.',true)}}
async function load(manual=false){if(loading)return;if(SHEET_CSV_URL==='PASTE_PUBLISHED_CSV_URL_HERE'){setStatus('Catalogue setup needed: add the published CSV URL in index.html.',true);return}loading=true;$('refresh').disabled=true;if(!tools.length)setStatus('Loading catalogue…');else if(manual)setStatus('Checking for updates…');try{const url=new URL(SHEET_CSV_URL);if(url.protocol!=='https:')throw Error('Use an HTTPS published CSV URL.');url.searchParams.set('_catalogue_check',Date.now());const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('Sheet returned HTTP '+response.status);const next=parseTools(await response.text());tools=next;lastLoaded=new Date();['zone','type','hazard'].forEach((id,i)=>populate(id,['zone','tool_type','hazards'][i]));filters();route();setStatus(next.length?manual?'Catalogue checked. Showing the latest available published data.':'':'The catalogue has no tools yet.');$('updated').textContent='Checked '+lastLoaded.toLocaleTimeString()}catch(err){setStatus((tools.length?'Could not refresh. Showing data from the last successful check. ':'Could not load the catalogue. ')+err.message+' Google publishing may take time to update.',true);$('updated').textContent=lastLoaded?'Last successful check '+lastLoaded.toLocaleTimeString():''}finally{loading=false;$('refresh').disabled=false}}
controls.forEach(id=>$(id).addEventListener(id==='search'?'input':'change',filters));$('refresh').addEventListener('click',()=>load(true));window.addEventListener('hashchange',route);window.addEventListener('online',()=>load());setInterval(()=>{if(!document.hidden)load()},POLL_MS);load();
</script></body></html>
